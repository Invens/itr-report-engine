name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://itr:itr@localhost:5432/itr
      REDIS_URL: redis://localhost:6379
      DEEPSEEK_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Build shared contracts
        run: pnpm --filter @itr/contracts build
      - name: Validate database package
        run: pnpm --filter @itr/database typecheck
      - name: Typecheck API
        id: api_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @itr/api typecheck 2>&1 | tee api-typecheck.log
      - name: Upload API typecheck diagnostics
        if: steps.api_typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: api-typecheck-log
          path: api-typecheck.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail on API typecheck errors
        if: steps.api_typecheck.outcome == 'failure'
        run: exit 1
      - name: Typecheck web
        run: pnpm --filter @itr/web typecheck
      - name: Build API
        run: pnpm --filter @itr/api build
      - name: Build web
        run: pnpm --filter @itr/web build

  migration:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itr
          POSTGRES_PASSWORD: itr
          POSTGRES_DB: itr
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U itr -d itr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://itr:itr@localhost:5432/itr
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install database dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent
      - name: Apply production migrations
        run: pnpm db:migrate

  docker:
    needs: quality
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build production images
        run: docker compose build api web
