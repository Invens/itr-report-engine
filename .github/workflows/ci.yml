name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itr
          POSTGRES_PASSWORD: itr
          POSTGRES_DB: itr
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U itr -d itr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    env:
      DATABASE_URL: postgresql://itr:itr@localhost:5432/itr
      REDIS_URL: redis://localhost:6379
      DEEPSEEK_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm build
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build production images
        run: docker compose build api web
